name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tipos e testes)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: educarize
          POSTGRES_PASSWORD: educarize
          POSTGRES_DB: educarize
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U educarize -d educarize"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://educarize:educarize@localhost:5432/educarize
      TEST_REDIS_URL: redis://localhost:6379
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test

  frontend:
    name: Frontend (tipos, lint e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    name: Ponta a ponta (Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: educarize
          POSTGRES_PASSWORD: educarize
          POSTGRES_DB: educarize
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U educarize -d educarize"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://educarize:educarize@localhost:5432/educarize
      E2E_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Instalar dependências
        run: |
          npm ci --prefix backend
          (cd backend && npx prisma generate)
          npm ci --prefix frontend
          npm ci --prefix e2e
      - name: Instalar Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Rodar testes
        working-directory: e2e
        run: npm test
      - name: Publicar relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
